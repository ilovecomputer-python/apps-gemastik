<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AURA">
  <title>AURA</title>
  <defs>
    <!-- The lit core: warm white falling off to peach -->
    <radialGradient id="aura-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF0E2"/>
      <stop offset="70%" stop-color="#FFCDB3"/>
      <stop offset="100%" stop-color="#F7A88E"/>
    </radialGradient>
    <radialGradient id="aura-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9C2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD9C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!--
    Eight petals radiating from the centre. Each ellipse is pushed outward but
    still crosses the middle, so the overlaps stack into the layered rosette;
    multiply blending is what darkens every crossing.
  -->
  <g style="mix-blend-mode: multiply" opacity="0.58">
    <g transform="translate(200 200)">
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#2E7A85"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#AFC684" transform="rotate(45)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#F2ACA4" transform="rotate(90)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#2E7A85" transform="rotate(135)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#AFC684" transform="rotate(180)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#2E7A85" transform="rotate(225)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#AFC684" transform="rotate(270)"/>
      <ellipse cx="0" cy="-62" rx="46" ry="104" fill="#F2ACA4" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Soft halo, then the core itself -->
  <circle cx="200" cy="200" r="78" fill="url(#aura-halo)"/>
  <circle cx="200" cy="200" r="46" fill="url(#aura-core)"/>
</svg>
